name: npm-publish
on:
  release:
    types: [published]
  workflow_dispatch:

# Deny-by-default at the top level: this workflow holds NPM_TOKEN and an OIDC identity, so no
# job gets any GITHUB_TOKEN scope unless it opts in explicitly (see the publish job below).
permissions: {}

jobs:
  # The release gate is the SAME suite every push and PR runs, called as a reusable workflow,
  # not a hand-copied subset of it. ci.yml runs test-all.mjs, test-kat.mjs, the demo regression,
  # the vendored-scanner drift diff and the Z3 formal proofs.
  gate:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # required for npm provenance (Sigstore/SLSA attestation)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      # The offline gate imports @noble/* and nothing is vendored, so without an install it dies on
      # ERR_MODULE_NOT_FOUND. --ignore-scripts because this job holds id-token: write.
      - name: Install from the lockfile (no scripts)
        run: npm ci --ignore-scripts
        working-directory: packages/verify-pqc

      - name: Full assurance suite (offline gate)
        run: PQC_SKIP_LIVE=1 node packages/verify-pqc/test-all.mjs

      - name: Publish @trelyan/verify-pqc (with provenance)
        run: npm publish --access public --provenance
        working-directory: packages/verify-pqc
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
